name: Check Disclosures

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      start_time:
        description: 'Start time/date/duration (e.g. 09:15, 2026-09-01, 2026-09-01 09:00:00, 24h, or leave empty for auto)'
        required: false
        type: string
      end_time:
        description: 'End time/date (e.g. 17:30, 2026-09-08, 2026-09-08 17:30:00, or leave empty for now)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-disclosures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests rich google-genai pypdf

      - name: Run disclosure checker
        env:
          SCHEDULED_HOUR: 17
          SCHEDULED_MIN: 30
          START_TIME: ${{ inputs.start_time }}
          END_TIME: ${{ inputs.end_time }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python check_disclosures.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update corporate disclosures [skip ci]" && git push)
